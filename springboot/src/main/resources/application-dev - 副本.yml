# ============================================
# 开发环境配置（dev profile）
# 仅包含环境相关的连接信息
# ============================================
spring:
  # ========== 数据源配置 ==========
  datasource:
    # 数据库连接 URL
    url: jdbc:mysql://localhost:3306/fitness?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 21125211323
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
      leak-detection-threshold: 60000
      # 强制每个连接的 MySQL 会话时区为 +08:00，确保 NOW() 返回上海时间（与 prod 一致）
      connection-init-sql: "SET time_zone = '+08:00'"

  # ========== Redis 配置（Boot 3+ 前缀为 spring.data.redis） ==========
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms

  # ========== RabbitMQ 配置 ==========
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 虚拟主机（默认 /）
    virtual-host: /
    # WebSocket STOMP 协议端口
    stomp:
      port: 61613
    # 消息可靠性配置
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 消息监听器配置
    listener:
      simple:
        # 手动确认
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 5
        max-concurrency: 20
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms

# ============================================
# 业务配置
# ============================================
app:
  membership:
    # 固定为 0：会员卡有效期严格按卡类型 duration_days 天计算，分钟级测试逻辑已移除
    # （代码不再读取此值，保留该键仅为兼容旧配置，禁止改成正数）。
    test-expire-minutes: 0

# ============================================
# 人脸识别（dev 使用 SmartJavaAI 离线识别）
# 模型由 DJL 自动下载（首次约 100MB），缓存在 data/ai-models 目录，后续离线运行。
# 切换模式后已录入的人脸需重新录入一次。
# 可选模式：mock / baidu / smartjava
# ============================================
face:
  mode: smartjava
  smartjava:
    similarity-threshold: 0.62
    model-cache-path: data/ai-models
