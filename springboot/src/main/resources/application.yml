# ============================================
# 服务器配置
# ============================================
server:
  # 服务端口号
  port: 8089

  # Tomcat 容器配置
  tomcat:
    # 最大并发连接数
    max-connections: 1000
    # 最大工作线程数
    threads:
      max: 200
      min-spare: 10
    # 请求体最大大小（字节，-1 表示不限制，由 multipart 配置控制）
    max-swallow-size: -1

  # HTTP 响应压缩
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

# ============================================
# Spring Boot 核心配置
# ============================================
spring:
  # 激活 dev 配置
  profiles:
    active: prod

  # 应用名称
  application:
    name: fitness

  # Jackson JSON 序列化（Spring Boot 4.x 使用 Jackson 3）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Flyway 数据库版本管理
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Base migration"
    repair-on-migrate: true
    # 老库中已应用但 classpath 已合并删除的迁移（V2/V3），忽略校验
    ignore-migration-patterns: "*:missing"

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件最大大小（100MB）
      max-file-size: 100MB
      # 整个请求最大大小（100MB）
      max-request-size: 100MB
      # 文件大小阈值（超过则写磁盘）
      file-size-threshold: 2MB
      # 临时文件目录
      location: /tmp

  # 异步任务线程池
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 200
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 5
      thread-name-prefix: scheduled-task-

# ============================================
# MyBatis 配置
# ============================================
mybatis:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包路径
  type-aliases-package: com.xiaoshan.fitness.entity
  configuration:
    # 开启驼峰命名自动映射：user_name → userName
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 二级缓存（默认关闭）
    cache-enabled: false
    # 延迟加载
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    local-cache-scope: statement

# ============================================
# JWT 认证配置
# ============================================
jwt:
  # JWT 密钥（至少 256 位，HS256 算法；用引号包裹避免 YAML 特殊字符解析问题）
  # 生产环境必须通过环境变量 JWT_SECRET 注入独立强密钥（≥32 字节随机串）：
  #   openssl rand -base64 48
  # 未注入时沿用开发默认值，仅可用于本地/测试。
  secret: "${JWT_SECRET:mySuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm1234567890!}"

# ============================================
# 日志配置
# ============================================
logging:
  charset:
    console: UTF-8
  level:
    com.xiaoshan.fitness: INFO
    org.springframework: INFO
    org.flywaydb: DEBUG
    org.springframework.security: WARN
    org.springframework.amqp: WARN
    org.apache.ibatis: WARN
    redis.clients: WARN
    com.zaxxer.hikari: WARN
  file:
    name: logs/fitness.log
    max-size: 100MB
    max-history: 7
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"

