# ============================================
# 支付模式
# mock  - 开发环境直接模拟支付成功（默认）
# alipay - 真实支付宝沙箱支付（需 app.pay.mode=alipay）
# ============================================
app:
  pay:
    # PAY_MODE=mock 可在生产临时切模拟支付（联调/降级），默认 alipay
    mode: ${PAY_MODE:alipay}
  file:
    # 文件上传根目录
    upload-dir: uploads
  share:
    # ffmpeg 可执行文件路径（视频转码）：缺省在 PATH 中查找；
    # 未安装时视频按原样播放（mp4 可直接播），安装后重启即启用转码
    ffmpeg-path: ffmpeg

# ============================================
# 人脸识别配置
# mock     - 本地图片哈希比对（默认，无需密钥，dev 兜底）
# baidu    - 百度智能云人脸识别 V3（真实人脸注册/搜索，需密钥）
# smartjava - SmartJavaAI 离线人脸识别（DJL 自动下载模型，SQLite 人脸库）
# ============================================
face:
  mode: mock
  smartjava:
    similarity-threshold: 0.62
    model-cache-path: data/ai-models
  baidu:
    api-key: ${BAIDU_FACE_API_KEY:}
    secret-key: ${BAIDU_FACE_SECRET_KEY:}
    # 人脸库分组 ID（首次注册自动创建）
    group-id: fitness_users
    # 搜索相似度阈值（0-100），默认 80
    score-threshold: 80
    # 图片质量/活体控制：NONE / LOW / NORMAL / HIGH
    quality-control: NORMAL
    liveness-control: NORMAL
    connect-timeout-ms: 3000
    read-timeout-ms: 10000

# ============================================
# 业务配置
# ============================================
business:
  # 会员卡配置
  membership:
    # 到期前提醒天数
    expire-remind-days: 7
  # 安全配置
  security:
    # 登录失败锁定时间（分钟）
    login-lock-minutes: 15
    # 最大登录失败次数
    max-login-attempts: 5

# ============================================
# 关键通知短信
# enabled       - 总开关（false 时不发送也不留痕）
# channel       - log：日志通道（默认，开发/无凭证环境直接在日志与 sms_records 演示）
#                 aliyun：阿里云短信（需配置 AK 与已审核签名/模板，未配齐自动降级 log）
# rate-limit    - 同一用户同一模板的最小间隔（秒），防重复触发/骚扰
# ============================================
sms:
  # SMS_ENABLED=false 时不发送也不留痕（应急关停开关）
  enabled: ${SMS_ENABLED:true}
  channel: log
  rate-limit-seconds: 60
  aliyun:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: 山达健身

# ============================================
# AI 能力（百度千帆大模型）
# ai.chat.provider：饮食对话实现
#   mock    - 本地规则私教（默认，无需密钥，开箱即用）
#   qianfan - 千帆真实大模型（需配置 AK/SK，未配置时饮食对话自动保持 mock）
# ai.qianfan.enabled：训练计划生成 / 智能客服是否启用千帆增强
#   false 时训练用本地动作库、客服用 FAQ+转人工，均不依赖外部模型
# 密钥通过环境变量注入，不要写死在仓库中
# ============================================
ai:
  chat:
    provider: ${AI_CHAT_PROVIDER:mock}
  qianfan:
    enabled: ${QIANFAN_ENABLED:false}
    access-key-id: ${QIANFAN_ACCESS_KEY_ID:}
    secret-access-key: ${QIANFAN_SECRET_ACCESS_KEY:}
    # 免费/低速模型降低开通门槛；可换 ernie-4.5-turbo-128k 等
    model: ${QIANFAN_MODEL:ernie-speed-128k}
    base-url: https://qianfan.baidubce.com
    token-url: https://aip.baidubce.com/oauth/2.0/token
    connect-timeout-ms: 3000
    read-timeout-ms: 20000
    temperature: 0.7
